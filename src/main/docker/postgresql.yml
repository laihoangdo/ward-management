# This configuration is intended for development purpose, it's **your** responsibility to harden it for production
name: monolithic
services:
  postgresql:
    # New environments use PostgreSQL with the PostGIS extension available.
    # Back up an existing PostgreSQL container before recreating it with this image.
    image: postgis/postgis:18-3.6
    # volumes:
    #   - ~/volumes/jhipster/Monolithic/postgresql/:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=Monolithic
      - POSTGRES_HOST_AUTH_METHOD=trust
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 10
    # If you want to expose these ports outside your dev PC,
    # remove the "127.0.0.1:" prefix
    ports:
      - 127.0.0.1:5432:5432
