<!doctype html>
<html lang="vi" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Quản lý địa bàn</title>
    <meta name="description" content="Quản lý hộ dân, nhân khẩu và bản đồ địa bàn" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#122e35" />
    <base href="/" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.webapp" />
    <link rel="stylesheet" href="/content/css/loading.css" />
    <!-- Load react main -->
    <script type="module" src="./app/index.tsx"></script>
    <!-- jhipster-needle-add-resources-to-root - JHipster will add new resources here -->
  </head>
  <body>
    <div id="root">
      <!-- Shown until React renders. Replaced by the app; no third-party troubleshooting text for end users. -->
      <div class="app-loading" role="status" aria-live="polite">
        <div class="app-loading-card">
          <span class="app-loading-spinner" aria-hidden="true"></span>
          <p class="app-loading-title">Đang tải hệ thống quản lý địa bàn…</p>
          <div id="app-loading-slow" class="app-loading-slow" hidden>
            <p>Ứng dụng tải lâu hơn bình thường. Kiểm tra kết nối mạng rồi tải lại trang.</p>
            <button type="button" onclick="location.reload()">Tải lại trang</button>
          </div>
        </div>
      </div>
    </div>
    <noscript>
      <h1>Cần bật JavaScript để sử dụng ứng dụng.</h1>
    </noscript>
    <script type="text/javascript">
      // After 15 s without the app, offer a reload instead of an endless spinner.
      setTimeout(function () {
        var slow = document.getElementById('app-loading-slow');
        if (slow) slow.hidden = false;
      }, 15000);
    </script>
  </body>
</html>
