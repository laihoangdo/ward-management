# Certificate-backed maintenance only; replace with a reviewed proxy config before app go-live.
log_format police_bootstrap '$remote_addr [$time_iso8601] $request_method $uri $status $body_bytes_sent';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/police-bootstrap-access.log police_bootstrap;
    return 404;
}

server {
    listen 80;
    listen [::]:80;
    server_name sunnytech.cloud;
    server_tokens off;
    access_log /var/log/nginx/police-bootstrap-access.log police_bootstrap;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/police-acme;
        default_type text/plain;
        limit_except GET { deny all; }
        try_files $uri =404;
    }
    location / {
        return 308 https://sunnytech.cloud$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sunnytech.cloud;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/sunnytech.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sunnytech.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:police_tls:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    client_max_body_size 1m;
    access_log /var/log/nginx/police-bootstrap-access.log police_bootstrap;

    # Short initial HSTS lifetime; no includeSubDomains/preload until all endpoints are audited.
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "3600" always;

    location / {
        default_type text/plain;
        return 503 "Service temporarily unavailable.\n";
    }
}
