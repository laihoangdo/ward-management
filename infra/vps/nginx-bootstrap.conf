# HTTP bootstrap only. No application, Keycloak, management or citizen data is served here.
# Deliberately omit query strings, cookies and Authorization from access logs.
log_format police_bootstrap '$remote_addr [$time_iso8601] $request_method $uri $status $body_bytes_sent';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/police-bootstrap-access.log police_bootstrap;
    return 404;
}

server {
    listen 80;
    listen [::]:80;
    server_name sunnytech.cloud;
    server_tokens off;
    client_max_body_size 1m;
    access_log /var/log/nginx/police-bootstrap-access.log police_bootstrap;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/police-acme;
        default_type text/plain;
        limit_except GET { deny all; }
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 503 "Service temporarily unavailable.\n";
    }
}
