# Only included inside the two reviewed public identity locations.
proxy_pass http://police_staging_identity;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host sunnytech.cloud;
proxy_set_header X-Forwarded-Host sunnytech.cloud;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Port 443;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Prefix "";
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Forwarded "";
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
proxy_buffering off;
proxy_cache off;
# Override maintenance header inheritance, leaving Keycloak's own login CSP intact.
add_header Strict-Transport-Security "max-age=86400" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cache-Control "no-store" always;
